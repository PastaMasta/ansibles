---
- name: Create groups
  become: true
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid }}"
    state: present
  loop: "{{ local_groups }}"

- name: Create users
  become: true
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | default([]) }}"
    append: true
    state: present
    uid: "{{ item.uid }}"
  loop: "{{ local_users }}"
